name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate
        run: |
          node --check app.mjs
          node --check google.mjs
          node --check bridge.mjs
          node --check transfer.mjs
          node --check pdf.mjs
          node --check theme.mjs
          node scripts/build-apps-script.mjs
          npm test
      - name: Prepare public files
        run: |
          mkdir -p public/vendor
          cp index.html styles.css favicon.svg .nojekyll *.mjs parse-worker.js public/
          cp vendor/xlsx.full.min.js vendor/LICENSE public/vendor/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
